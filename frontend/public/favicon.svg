<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061"/>
      <stop offset="50%" stop-color="#d49e24"/>
      <stop offset="100%" stop-color="#9e6e0d"/>
    </linearGradient>
    <linearGradient id="favGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34a862"/>
      <stop offset="60%" stop-color="#1b4d2b"/>
      <stop offset="100%" stop-color="#0f301b"/>
    </linearGradient>
    <radialGradient id="favSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9e0"/>
      <stop offset="50%" stop-color="#f5cf53"/>
      <stop offset="100%" stop-color="#d49e24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(100, 100)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="url(#favGold)" stroke-width="5"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#favGold)" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Sun Glow & Rays -->
    <circle cx="0" cy="-35" r="22" fill="url(#favSun)"/>
    <circle cx="0" cy="-35" r="14" fill="#fff9e0"/>
    <line x1="0" y1="-55" x2="0" y2="-75" stroke="url(#favGold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="-50" x2="35" y2="-70" stroke="url(#favGold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-18" y1="-50" x2="-35" y2="-70" stroke="url(#favGold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="-35" x2="55" y2="-45" stroke="url(#favGold)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="-35" x2="-55" y2="-45" stroke="url(#favGold)" stroke-width="2" stroke-linecap="round"/>

    <!-- Horizon curves -->
    <path d="M -75,-8 Q 0,-25 75,-8" fill="none" stroke="url(#favGold)" stroke-width="1.5" opacity="0.7"/>
    <path d="M -80,12 Q 0,-8 80,12" fill="none" stroke="url(#favGold)" stroke-width="1.8" opacity="0.8"/>

    <!-- Tractor -->
    <g transform="translate(18, 6) scale(0.65)">
      <!-- Rear Wheel -->
      <circle cx="-60" cy="35" r="42" fill="#141815" stroke="url(#favGold)" stroke-width="2"/>
      <circle cx="-60" cy="35" r="24" fill="url(#favGold)"/>
      <circle cx="-60" cy="35" r="10" fill="#141815"/>

      <!-- Body / Bonnet -->
      <path d="M -25,-15 L 50,-15 C 60,-15 65,-8 65,5 L 62,25 L -25,25 Z" fill="url(#favGreen)" stroke="#5ec285" stroke-width="2"/>
      <!-- Cab Roof -->
      <path d="M -48,-18 L -52,-70 L 0,-65 L -10,-18" fill="none" stroke="url(#favGreen)" stroke-width="5" stroke-linecap="round"/>
      <path d="M -58,-70 L 10,-65" stroke="url(#favGold)" stroke-width="4" stroke-linecap="round"/>
      <!-- Exhaust -->
      <line x1="22" y1="-15" x2="22" y2="-60" stroke="#aaa" stroke-width="3"/>
      <!-- Grille -->
      <line x1="52" y1="-8" x2="60" y2="-8" stroke="url(#favGold)" stroke-width="2"/>
      <line x1="52" y1="0" x2="60" y2="0" stroke="url(#favGold)" stroke-width="2"/>
      <line x1="52" y1="8" x2="60" y2="8" stroke="url(#favGold)" stroke-width="2"/>
      <line x1="52" y1="16" x2="59" y2="16" stroke="url(#favGold)" stroke-width="2"/>

      <!-- Front Wheel -->
      <circle cx="45" cy="40" r="24" fill="#141815" stroke="url(#favGold)" stroke-width="1.5"/>
      <circle cx="45" cy="40" r="13" fill="url(#favGold)"/>
    </g>

    <!-- Wheat Sheaf -->
    <g transform="translate(-52, 6) scale(0.65)">
      <path d="M 20,80 Q -25,10 -15,-100" fill="none" stroke="url(#favGold)" stroke-width="3"/>
      <path d="M 25,80 Q 2,15 25,-85" fill="none" stroke="url(#favGold)" stroke-width="2.5"/>
      <path d="M 18,80 Q -45,15 -50,-70" fill="none" stroke="url(#favGold)" stroke-width="2.5"/>
      <!-- Wheat heads -->
      <g transform="translate(-15, -80)">
        <path d="M0,-20 C-5,-14 -5,-6 0,0 C5,-6 5,-14 0,-20 Z" fill="url(#favGold)"/>
        <path d="M-6,-10 C-12,-5 -12,2 -6,8 C-1,4 -1,-5 -6,-10 Z" fill="url(#favGold)"/>
        <path d="M6,-10 C12,-5 12,2 6,8 C1,4 1,-5 6,-10 Z" fill="url(#favGold)"/>
        <path d="M-6,4 C-12,9 -12,16 -6,22 C-1,18 -1,9 -6,4 Z" fill="url(#favGold)"/>
        <path d="M6,4 C12,9 12,16 6,22 C1,18 1,9 6,4 Z" fill="url(#favGold)"/>
        <line x1="0" y1="-20" x2="-6" y2="-45" stroke="url(#favGold)" stroke-width="1.2"/>
        <line x1="0" y1="-20" x2="6" y2="-45" stroke="url(#favGold)" stroke-width="1.2"/>
      </g>
      <!-- Rope -->
      <ellipse cx="20" cy="50" rx="14" ry="5" fill="#875b08" stroke="url(#favGold)" stroke-width="1.5"/>
    </g>
  </g>
</svg>